name: CI

on:
  push:
    # Not just main. The voice work landed on an advisor/* branch and broke the
    # androidTest sources for a day without anyone noticing, because CI never ran
    # on it -- the compileDebugAndroidTestKotlin step below would have caught it
    # the same afternoon.
    branches: [main, 'advisor/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The native build pulls NDK/CMake, and the runner's SDK licences are not
      # pre-accepted: every run on main since at least v1.0.3 failed here with
      # LicenceNotAcceptedException before this step existed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Compile Android test sources
        run: ./gradlew compileDebugAndroidTestKotlin

      # No APK assembly here, deliberately.
      #
      # Assembling triggers the vendored llama.cpp native build, whose Vulkan
      # backend generates compute shaders at build time. That pipeline does not
      # work when cross-compiling for aarch64 on a hosted Linux runner — with
      # glslc absent the link fails on undefined flash_attn_* symbols, and with
      # it installed the failures merely move to other shader symbols. It has
      # never succeeded in CI.
      #
      # It also could not produce anything shippable: the release keystore is
      # git-ignored and local-only by design, so signed builds are made on a
      # developer machine and verified on a physical arm64 device. CI's job here
      # is to catch regressions in app code, which the steps above do — the unit
      # tests caught a real timezone bug on their first working run.

      - name: Run Android lint
        run: ./gradlew lint

      # Uploads are diagnostics, not verdicts. "Artifact storage quota has been
      # hit" failed the Release 1.2.1 run *after* every build, test and compile
      # step had passed, which is exactly how a red CI stops meaning anything.
      #
      # Note the instrumented-test comment below warns that continue-on-error
      # once made a permanently broken job look green. That was on a job which
      # *verified* something; this is on steps that only publish reports. A
      # failed upload says nothing about the code, and no verification step here
      # carries it.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results.html
          retention-days: 7

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          retention-days: 7

  # Instrumented tests are deliberately NOT run in CI.
  #
  # The app is built for arm64-v8a only, so an x86_64 emulator cannot execute
  # it, and GitHub-hosted macOS ARM runners cannot start an accelerated arm64
  # emulator — every attempt failed with:
  #     HVF error: HV_UNSUPPORTED
  #     qemu-system-aarch64-headless: failed to initialize HVF
  # so this job has never once passed. It previously carried
  # continue-on-error: true, which made a permanently broken job look green.
  #
  # The suite is real and passing: 57/57 on a physical arm64 device. Run it
  # there before releasing:
  #
  #   ./gradlew assembleDebug assembleDebugAndroidTest
  #   adb install -r app/build/outputs/apk/debug/app-debug.apk
  #   adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  #   adb shell am instrument -w -r \
  #     com.aliahad.aichat.debug.test/androidx.test.runner.AndroidJUnitRunner
  #
  # The debug build uses applicationIdSuffix ".debug" so it installs alongside
  # the release build without deleting the downloaded model.
